# Verktøy for Linux/WSL – tilsvarer Brewfile på Mac.
# Grunnpakker og enkle CLI-verktøy (zsh, tmux, stow, git, delta, jq, ripgrep, fzf, direnv osv.)
# installeres med apt i setup.sh. Her ligger det apt mangler eller har for gamle versjoner av.
# Språk (dotnet, python, rust osv.) ligger i langs/ og lenkes inn i conf.d av setup.sh.
[tools]
# Shell / CLI
"github:eza-community/eza" = "latest"
fd = "latest"
zoxide = "latest"
bat = "latest"
starship = "latest"
bottom = "latest"
gh = "latest"
watchexec = "latest"

# Editors / TUI
neovim = "latest"
lazygit = "latest"
lazydocker = "latest"
yazi = "latest"

# Languages / runtimes – språkene velges i setup.sh, se langs/
node = "lts"
pnpm = "latest"
yarn = "latest"
hugo = "latest"
adr-tools = "latest"

# Build / dev tooling
sqlc = "latest"
flyctl = "latest"

# Third-party
stripe = "latest"
"npm:clever-tools" = "latest"
"github:juxt/allium-tools" = "latest"
